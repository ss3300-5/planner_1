<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planner</title>
<script>(function(){try{var p=localStorage.getItem('plannerView');
if(p==='pc')return;
if(p==='mobile'||(window.matchMedia&&!matchMedia('(min-width:900px)').matches))location.replace('index.html?mobile');}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Cormorant+Garamond:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/pc.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><symbol id="i-dash" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></symbol><symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></symbol><symbol id="i-todo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></symbol><symbol id="i-ai" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol><symbol id="fo" viewBox="0 0 24 24"><path d="M3 6a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></symbol><symbol id="be" viewBox="0 0 24 24"><path d="M18 9a6 6 0 10-12 0c0 6-2.5 8-2.5 8h17S18 15 18 9zM10 20a2 2 0 004 0"/></symbol><symbol id="pl" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="ck" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol></defs></svg>
<aside class="side">
  <div class="brand"><img src="img/logo.png" alt="Planner"><div><b>Planner</b><small>予定・タスク管理</small></div></div>
  <ul class="nav">
    <li><a data-p="dash" onclick="showPage('dash')"><svg class="i"><use href="#i-dash"/></svg>ダッシュボード</a></li>
    <li><a data-p="cal" onclick="showPage('cal')"><svg class="i"><use href="#i-cal"/></svg>カレンダー<em id="bCal"></em></a></li>
    <li><a data-p="todo" onclick="showPage('todo')"><svg class="i"><use href="#i-todo"/></svg>TODO ＆ メモ<em id="bTodo"></em></a></li>
    <li><a data-p="claude" onclick="showPage('claude')"><svg class="i"><use href="#i-ai"/></svg>Claudeの進捗</a></li>
  </ul>
  <p class="grp">フォルダー</p>
  <ul class="nav fl" id="folders"></ul>
  <div class="side-b">
    <a onclick="openAuth()">アカウント／同期</a>
    <a onclick="exportData()">データを書き出す</a>
    <a onclick="importData()">データを読み込む</a>
    <a onclick="setViewMode('mobile')">モバイル表示に切り替え</a>
    <a id="viewAuto" style="display:none" onclick="setViewMode('auto')">表示を自動に戻す</a>
  </div>
</aside>
<main>
  <header class="hd">
    <h1 id="title"></h1><p class="dl" id="dateBar"></p><div class="tabs" id="tabs"></div>
    <div class="act">
      <button class="ib" onclick="folderDlg()" aria-label="フォルダー"><svg class="i"><use href="#fo"/></svg></button>
      <button class="ib" onclick="notifDlg()" aria-label="通知"><svg class="i"><use href="#be"/></svg></button>
      <div class="newwrap"><button class="new" onclick="toggleNew(event)"><svg class="i"><use href="#pl"/></svg>新規作成</button>
        <div class="menu" id="newMenu"><a onclick="newItem('ev')">予定</a><a onclick="newItem('todo')">TODO</a><a onclick="newItem('memo')">メモ</a></div></div>
    </div>
  </header>
  <section class="page" id="p-dash"></section>
  <section class="page" id="p-cal"></section>
  <section class="page" id="p-todo"><div class="g2p">
    <section class="pn a"><h3>TODO</h3><div class="todo-in"><input class="finput" id="todoInput" placeholder="新しいタスク"><input class="finput" id="todoDue" type="date" title="期限" style="width:150px"><button class="btn btn-prim" onclick="addTodo()">追加</button></div><div id="todoList"></div></section>
    <section class="memo" style="flex:none"><h3>メモ</h3><textarea class="finput memo-ta" id="memoText" rows="10" placeholder="ちょっとしたメモ…"></textarea><div class="btn-row"><button class="btn btn-prim" onclick="saveMemo(this)">保存</button></div></section>
  </div></section>
  <section class="page" id="p-claude"></section>
</main>

<div class="overlay" id="dlg" onclick="ovClose(event,'dlg')"><div class="modal"><div class="modal-hdr"><div class="modal-title" id="dlgTitle"></div><button class="modal-x" onclick="closeModal('dlg')">×</button></div><div class="modal-body" id="dlgBody"></div></div></div>
<!-- Account / Sync -->
<div class="overlay" id="authModal" onclick="ovClose(event,'authModal')">
  <div class="modal">
    <div class="modal-hdr"><div class="modal-title">アカウント／同期</div><button class="modal-x" onclick="closeModal('authModal')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="modal-body">
      <div id="authStatus" style="font-size:13px;color:var(--t2);margin-bottom:12px;white-space:pre-line"></div>
      <div id="authForm">
        <div class="fg"><label>メールアドレス</label><input class="finput" id="authEmail" type="email" autocomplete="email"></div>
        <div class="fg"><label>パスワード（6文字以上）</label><input class="finput" id="authPass" type="password" autocomplete="current-password"></div>
        <div class="btn-row"><button class="btn btn-ghost" onclick="authSignUp()">新規登録</button><button class="btn btn-prim" onclick="authSignIn()">ログイン</button></div>
      </div>
      <div class="btn-row" style="margin-top:0"><button class="btn btn-ghost" onclick="authDiagnose()">接続を診断</button></div>
      <div id="authDiag" style="white-space:pre-line;font-size:12px;line-height:1.7;color:var(--t2);margin:10px 0"></div>
      <div id="authOut" style="display:none"><div class="btn-row"><button class="btn btn-ghost" onclick="Store.sync()">今すぐ同期</button><button class="btn btn-del" onclick="authSignOut()">ログアウト</button></div></div>
    </div>
  </div>
</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/core.js"></script>
<script src="js/series.js"></script>
<script src="js/account.js"></script>
<script src="js/pc.js"></script>
</body>
</html>
